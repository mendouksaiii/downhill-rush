name: Evolve Overseer

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run evolution job
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Deliberately no fallback here. This previously pinned the pre-rename
          # Vercel domain, which silently overrode the script's own (correct)
          # default and pointed telemetry at the wrong deploy. An unset repo
          # variable resolves to '' — falsy — so scripts/evolve-overseer.mjs picks
          # its default and the production URL lives in exactly one place.
          # Set the GAME_URL repo variable to point a run at a preview deploy.
          GAME_URL: ${{ vars.GAME_URL }}
        run: node scripts/evolve-overseer.mjs

      - name: Commit evolved tuning
        run: |
          if git diff --quiet overseer-tuning.json; then
            echo "no tuning change"
            exit 0
          fi
          git config user.name "overseer-evolve[bot]"
          git config user.email "overseer-evolve@users.noreply.github.com"
          git add overseer-tuning.json
          git commit -m "Overseer evolution: $(node -e "console.log(require('./overseer-tuning.json').rationale.slice(0,60))")"
          git push
