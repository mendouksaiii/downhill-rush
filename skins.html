<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1040">
<title>DOWNHILL RUSH — Skin Shop (design preview)</title>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1040;
    font-family:'Rajdhani',sans-serif; touch-action:none; user-select:none; }
  canvas#stage { position:fixed; inset:0; display:block; }
  #hdr { position:fixed; top:0; left:0; right:0; z-index:10; text-align:center; padding:10px;
    pointer-events:none; }
  #hdr h1 { font-size:clamp(20px,4vw,30px); letter-spacing:6px; font-weight:700;
    background:linear-gradient(180deg,#ffd76e,#ff7847,#ff2e88);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 16px rgba(255,46,136,.5)); }
  #hdr .sub { font-size:12px; letter-spacing:3px; color:#9a92c9; }
  #tabs { position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:11; display:flex; gap:8px; }
  #tabs button { padding:8px 22px; font:700 15px 'Rajdhani',sans-serif; letter-spacing:3px;
    color:#9a92c9; background:rgba(20,14,48,.8); border:1px solid rgba(255,255,255,.15);
    border-radius:10px; cursor:pointer; }
  #tabs button.on { color:#04222a; background:#ffd76e; border-color:#ffd76e;
    box-shadow:0 0 16px rgba(255,215,110,.5); }
  .lbl { position:fixed; z-index:5; transform:translate(-50%,0); text-align:center;
    pointer-events:none; white-space:nowrap; }
  .lbl .n { font-size:14px; font-weight:700; letter-spacing:2px; color:#fff; }
  .lbl .t { font-size:10px; font-weight:700; letter-spacing:2px; }
  .lbl .p { font-size:11px; color:#cfc8f0; letter-spacing:1px; }
  #bar { position:fixed; bottom:0; left:0; right:0; z-index:10; display:flex; gap:6px;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom)); overflow-x:auto;
    background:linear-gradient(0deg, rgba(10,6,28,.85), transparent); }
  #bar button { flex:0 0 auto; padding:8px 12px; font:700 12px 'Rajdhani',sans-serif;
    letter-spacing:2px; color:#cfc8f0; background:rgba(20,14,48,.8);
    border:1px solid rgba(255,255,255,.15); border-radius:10px; cursor:pointer; }
  #bar button.on { color:#04222a; background:#00e5ff; border-color:#00e5ff;
    box-shadow:0 0 14px rgba(0,229,255,.5); }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hdr">
  <h1>SKIN SHOP</h1>
  <div class="sub">DESIGN PREVIEW · V3 · NOT IN GAME YET</div>
</div>
<div id="tabs">
  <button id="tabRiders" class="on">RIDERS</button>
  <button id="tabBikes">BIKES</button>
</div>
<div id="bar"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { TIER, mat, BIKES, buildBike, RIDERS } from './skins-data.js';

const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const canvas=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile?1.5:2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x3a2158, 32, 150);
const camera=new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 500);

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

let composer=null;
if(!isMobile){
  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{OutputPass}]=await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),
  ]);
  composer=new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.38,0.45,0.8));
  composer.addPass(new OutputPass());
}

const skyMat=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
  vertexShader:`varying vec3 vDir; void main(){ vDir=position;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vDir; void main(){
    float h=normalize(vDir).y;
    vec3 col=mix(vec3(1.0,0.47,0.278),vec3(1.0,0.18,0.533),smoothstep(0.0,0.16,h));
    col=mix(col,vec3(0.102,0.063,0.251),smoothstep(0.08,0.6,h));
    if(h<0.0) col=mix(col,vec3(0.16,0.1,0.26),smoothstep(0.0,-0.3,h));
    gl_FragColor=vec4(col,1.0); }`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300,24,12), skyMat));
const sun=new THREE.Mesh(new THREE.CircleGeometry(26,26),
  new THREE.MeshBasicMaterial({color:0xffd76e, fog:false}));
sun.position.set(0,16,140); scene.add(sun);

scene.add(new THREE.HemisphereLight(0x5a4d9e, 0x1a1040, 0.8));
const key=new THREE.DirectionalLight(0xffc9a0, 1.8); key.position.set(-6,12,18); scene.add(key);
const rim=new THREE.DirectionalLight(0xff2e88, 0.9); rim.position.set(6,6,-14); scene.add(rim);

const floor=new THREE.Mesh(new THREE.CircleGeometry(140,48),
  new THREE.MeshStandardMaterial({color:0x2c2454, roughness:.95}));
floor.rotation.x=-Math.PI/2; scene.add(floor);

/* ============================ GALLERY ===================================== */
const bikesRoot=new THREE.Group(), ridersRoot=new THREE.Group();
scene.add(bikesRoot, ridersRoot);

function pedestal(base, tierHex, glowHex){
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.8,.5,24),
    mat(0x1c1638,{r:.8}));
  ped.position.y=.25; base.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.05,8,40),
    mat(0x111111,{e:tierHex,ei:.75}));
  ring.rotation.x=Math.PI/2; ring.position.y=.53; base.add(ring);
  const glowRing=new THREE.Mesh(new THREE.TorusGeometry(1.0,.03,8,32),
    mat(0x111111,{e:glowHex,ei:.9}));
  glowRing.rotation.x=Math.PI/2; glowRing.position.y=.56; base.add(glowRing);
}
function makeGallery(defs, order, root, buildFn, cols){
  const items=[];
  defs.forEach((skin)=>{
    const i=order.indexOf(skin.id);
    const col=i%cols, row=Math.floor(i/cols);
    const x=(col-(cols-1)/2)*4.6+(row%2?2.3:0), z=row*6.5;
    const base=new THREE.Group(); base.position.set(x,0,z);
    pedestal(base, TIER[skin.tier].hex, skin.glow);
    const spin=new THREE.Group(); spin.position.y=.53;
    const model=new THREE.Group();
    const anim=buildFn(skin, model);
    spin.add(model); base.add(spin);
    root.add(base);
    items.push({skin, base, spin, model, anim, phase:Math.random()*6.28,
      anchor:new THREE.Vector3(x, row%2?3.6:2.75, z)});
  });
  return items;
}
const bikeItems=makeGallery(BIKES,
  ['inferno','silver','diamond','gold','voltage','sunset','night','frost','toxic','sakura'],
  bikesRoot, (s,m)=>{ m.add(buildBike(s)); }, 5);
const riderItems=makeGallery(RIDERS,
  ['mendo','spike','himars','ronin',
   'raiden','berna','stephyberry','dave',
   'dylan','ik','cherry','princess',
   'bella','titan','begone','rookie'],
  ridersRoot, (s,m)=>s.build(m), 4);

/* ============================ LABELS & UI ================================= */
const allLabels=[];
function makeLabels(items){
  return items.map(({skin})=>{
    const t=TIER[skin.tier];
    const el=document.createElement('div'); el.className='lbl';
    el.innerHTML='<div class="n"></div><div class="t" style="color:'+t.col+'">'+t.label+
      '</div><div class="p">'+(skin.price?'◈ '+skin.price.toLocaleString():'FREE')+'</div>';
    el.querySelector('.n').textContent=skin.name;
    document.body.appendChild(el); allLabels.push(el); return el;
  });
}
const bikeLabels=makeLabels(bikeItems), riderLabels=makeLabels(riderItems);

let mode='riders', focusI=-1, orbitA=0;
const bar=document.getElementById('bar');
function activeItems(){ return mode==='bikes'?bikeItems:riderItems; }
function activeLabels(){ return mode==='bikes'?bikeLabels:riderLabels; }
function overviewFor(m){
  return m==='bikes'
    ? {pos:new THREE.Vector3(0,7.5,-15), tgt:new THREE.Vector3(0,.9,4.5)}
    : {pos:new THREE.Vector3(0,11.5,-18.5), tgt:new THREE.Vector3(0,.3,9.5)};
}
function rebuildBar(){
  bar.innerHTML='';
  const all=document.createElement('button');
  all.textContent='ALL'; all.dataset.i=-1; all.className=focusI<0?'on':'';
  bar.appendChild(all);
  activeItems().forEach((it,i)=>{
    const b=document.createElement('button');
    b.textContent=it.skin.name; b.dataset.i=i;
    b.style.color=TIER[it.skin.tier].col;
    if(focusI===i) b.className='on';
    bar.appendChild(b);
  });
}
function setMode(m){
  mode=m; focusI=-1;
  bikesRoot.visible=m==='bikes'; ridersRoot.visible=m==='riders';
  document.getElementById('tabBikes').classList.toggle('on',m==='bikes');
  document.getElementById('tabRiders').classList.toggle('on',m==='riders');
  allLabels.forEach(l=>l.style.display='none');
  rebuildBar();
}
document.getElementById('tabBikes').addEventListener('click',()=>setMode('bikes'));
document.getElementById('tabRiders').addEventListener('click',()=>setMode('riders'));
bar.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  focusI=+b.dataset.i;
  bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
addEventListener('pointerdown',e=>{
  if(e.target.closest('#bar')||e.target.closest('#tabs')) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const items=activeItems();
  for(let i=0;i<items.length;i++){
    if(ray.intersectObject(items[i].base,true).length){
      focusI=i;
      bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));
      return;
    }
  }
});
setMode('riders');

/* ============================ LOOP ======================================== */
const camPos=new THREE.Vector3(0,11.5,-18.5), camTgt=new THREE.Vector3(0,.3,9.5);
let last=performance.now();
function frame(){
  const now=performance.now(), dt=Math.min((now-last)/1000,.05); last=now;
  const t=now/1000;
  for(const it of activeItems()){
    it.spin.rotation.y+=dt*.7;
    if(mode==='riders'){
      it.model.position.y=Math.sin(t*1.7+it.phase)*.04;
      it.model.rotation.z=Math.sin(t*1.3+it.phase)*.03;
    }
    if(it.anim) it.anim(t);
  }
  let wantPos, wantTgt;
  if(focusI<0){
    const o=overviewFor(mode); wantPos=o.pos; wantTgt=o.tgt;
  } else {
    orbitA+=dt*.4;
    const a=activeItems()[focusI].base.position;
    wantPos=new THREE.Vector3(a.x+Math.sin(orbitA)*4.2, 2.7, a.z+Math.cos(orbitA)*-4.2);
    wantTgt=new THREE.Vector3(a.x, 1.35, a.z);
  }
  camPos.lerp(wantPos, Math.min(1,dt*3.5));
  camTgt.lerp(wantTgt, Math.min(1,dt*3.5));
  camera.position.copy(camPos); camera.lookAt(camTgt);
  const v=new THREE.Vector3();
  const items=activeItems(), labels=activeLabels();
  items.forEach((it,i)=>{
    v.copy(it.anchor).project(camera);
    const el=labels[i];
    const onScreen=v.z<1 && Math.abs(v.x)<1.08;
    const dim=focusI>=0 && focusI!==i;
    el.style.display=onScreen&&!dim?'block':'none';
    el.style.left=((v.x*.5+.5)*innerWidth)+'px';
    el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
  });
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer) composer.setSize(innerWidth,innerHeight);
});
window.SHOP={ focus(i){ focusI=i; }, setMode, get mode(){ return mode; },
  riders:riderItems, bikes:bikeItems };
</script>
</body>
</html>
