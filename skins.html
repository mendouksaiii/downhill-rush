const scene=new THREE.Scene();

let composer=null;

  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{OutputPass}]=await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/OutputPass.js'),

  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.38,0.45,0.8));
  composer.addPass(new OutputPass());
}

  fragmentShader:`varying vec3 vDir; void main(){

function makeBikeMat(def, physical){
  const C=physical?THREE.MeshPhysicalMaterial:THREE.MeshStandardMaterial;
  const m=new C({ color:def.color, flatShading:true,
    roughness:def.rough!==undefined?def.rough:.5,
    metalness:def.metal!==undefined?def.metal:0 });
  if(def.envI) m.envMapIntensity=def.envI;
  if(def.emissive){ m.emissive=new THREE.Color(def.emissive); m.emissiveIntensity=def.ei||1; }
  if(physical){ m.iridescence=.7; m.iridescenceIOR=1.6; }
  return m;
}
function buildBike(skin){
  const g=new THREE.Group();
  const M={ frame:makeBikeMat(skin.frame, skin.physical),
            accent:makeBikeMat(skin.accent, skin.physical),
            wheel:makeBikeMat(skin.wheels) };
  const dark=mat(0x14101f,{r:.6});
  const wheelGeo=skin.discWheels
    ? new THREE.CylinderGeometry(.48,.48,.1,18)
    : new THREE.CylinderGeometry(.48,.48,.14,10);
  wheelGeo.rotateZ(Math.PI/2);
  for(const z of [.82,-.82]){
    const w=new THREE.Mesh(wheelGeo,M.wheel); w.position.set(0,.48,z); g.add(w);
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.18,8),M.accent);
    hub.rotation.z=Math.PI/2; hub.position.set(0,.48,z); g.add(hub);
  }
  const box=(w,h,d,x,y,z,m,rx=0)=>{ const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
    b.position.set(x,y,z); b.rotation.x=rx; g.add(b); return b; };
  box(.14,.14,1.7, 0,.62,0, M.frame);
  box(.12,.12,1.15, 0,1.04,.03, M.frame, .1);
  box(.12,.55,.12, 0,.85,.72, M.frame, .25);
  box(.12,.5,.12, 0,.85,-.55, M.frame, -.2);
  box(.34,.07,.46, 0,1.14,-.6, dark);
  box(.6,.08,.08, 0,1.16,.68, M.accent);
  box(.09,.09,.1, .3,1.16,.68, dark);
  box(.09,.09,.1,-.3,1.16,.68, dark);
  const cr=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.06,10),M.accent);
  cr.rotation.z=Math.PI/2; cr.position.set(0,.5,-.12); g.add(cr);
  box(.3,.05,.05, 0,.5,-.12, dark);
  box(.1,.04,.16, .18,.5,-.12, dark);
  box(.1,.04,.16,-.18,.5,-.12, dark);
  if(skin.extras) skin.extras(g,M);
  return g;
}

/* ============================ RIDER BUILDER =============================== */
// Standing rig ~2.1 units tall. Helpers shared by all 15 characters.
function riderRig(g, o){
  // o: skin, top, pants, shoes, eyes, shirt?, legTop?, legBot?, headScale?, bulk?
  const S={ skin:mat(o.skin), top:mat(o.top), pants:mat(o.pants), shoes:mat(o.shoes,{r:.35}) };
  const bulk=o.bulk||1, hs=o.headScale||1;
  const box=(w,h,d,x,y,z,m,rx=0,ry=0,rz=0)=>{
    const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
    b.position.set(x,y,z); b.rotation.set(rx,ry,rz); g.add(b); return b; };
  for(const s of [-1,1]){
    box(.17,.5,.17, s*.12,.75,0, o.legTop?mat(o.legTop):S.pants);
    box(.15,.5,.15, s*.12,.28,0, o.legBot?mat(o.legBot):S.pants);
    box(.17,.12,.32, s*.12,.06,.05, S.shoes);
  }
  const torso=box(.52*bulk,.64,.3*bulk, 0,1.34,0, S.top);
  if(o.shirt) box(.2,.52,.05, 0,1.32,.16*bulk, mat(o.shirt));
  for(const s of [-1,1]){
    box(.14*bulk,.56,.14*bulk, s*(.34*bulk),1.3,0, S.top, 0,0,-s*.1);
    box(.1,.1,.1, s*(.37*bulk),.97,0, S.skin);
  }
  const headY=1.86+(hs-1)*.12;
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.23*hs,0),S.skin);
  head.position.set(0,headY,0); g.add(head);
  for(const s of [-1,1])
    box(.055*hs,.06*hs,.02, s*.08*hs, headY+.02, .2*hs, mat(0x111111,{e:o.eyes,ei:1.2}));
  return { S, box, head, headY, hs, torso,
    hairCap(color,scale=1){ const h=new THREE.Mesh(new THREE.IcosahedronGeometry(.25*hs*scale,0),mat(color,{r:.7}));
      h.scale.y=.75; h.position.set(0,headY+.1,-.02); g.add(h); return h; },
    hairBack(color,len=.5,w=.34){ const h=box(w,len,.1, 0,headY-len/2+.12,-.2*hs, mat(color,{r:.7})); return h; },
    hat(color,r=.26){ const b=new THREE.Mesh(new THREE.CylinderGeometry(r,r*.9,.09,10),mat(color,{r:.6}));
      b.position.set(0,headY+.22,0); b.rotation.z=.12; g.add(b); return b; },
    skirt(color,r=.44){ const s=new THREE.Mesh(new THREE.CylinderGeometry(.26,r,.32,10),mat(color,{r:.6}));
      s.position.set(0,.94,0); g.add(s); return s; },
  };
}

/* ============================ GALLERY ===================================== */
const bikesRoot=new THREE.Group(), ridersRoot=new THREE.Group();
scene.add(bikesRoot, ridersRoot);

function pedestal(base, tierHex, glowHex){
  const ped=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.8,.5,24),
    mat(0x1c1638,{r:.8}));
  ped.position.y=.25; base.add(ped);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(1.55,.05,8,40),
    mat(0x111111,{e:tierHex,ei:.75}));
  ring.rotation.x=Math.PI/2; ring.position.y=.53; base.add(ring);
  const glowRing=new THREE.Mesh(new THREE.TorusGeometry(1.0,.03,8,32),
    mat(0x111111,{e:glowHex,ei:.9}));
  glowRing.rotation.x=Math.PI/2; glowRing.position.y=.56; base.add(glowRing);
}
function makeGallery(defs, order, root, buildFn, cols){
  const items=[];
  defs.forEach((skin)=>{
    const i=order.indexOf(skin.id);
    const col=i%cols, row=Math.floor(i/cols);
    const x=(col-(cols-1)/2)*4.6+(row%2?2.3:0), z=row*6.5;
    const base=new THREE.Group(); base.position.set(x,0,z);
    pedestal(base, TIER[skin.tier].hex, skin.glow);
    const spin=new THREE.Group(); spin.position.y=.53;
    const model=new THREE.Group();
    buildFn(skin, model);
    spin.add(model); base.add(spin);
    root.add(base);
    items.push({skin, base, spin, anchor:new THREE.Vector3(x, row%2?3.6:2.75, z)});
  });
  return items;
}
const bikeItems=makeGallery(BIKES,
  ['inferno','silver','diamond','gold','voltage','sunset','night','frost','toxic','sakura'],
  bikesRoot, (s,m)=>m.add(buildBike(s)), 5);
const riderItems=makeGallery(RIDERS,
  ['ronin','himars','mendo','spike','raiden',
   'dave','dylan','ik','titan','begone',
   'berna','cherry','princess','bella','stephyberry'],
  ridersRoot, (s,m)=>s.build(m), 5);

/* ============================ LABELS & UI ================================= */
const allLabels=[];
function makeLabels(items){
  return items.map(({skin})=>{
    const t=TIER[skin.tier];
    const el=document.createElement('div'); el.className='lbl';
    el.innerHTML='<div class="n"></div><div class="t" style="color:'+t.col+'">'+t.label+
      '</div><div class="p">◈ '+skin.price.toLocaleString()+'</div>';
    el.querySelector('.n').textContent=skin.name;
    document.body.appendChild(el); allLabels.push(el); return el;
  });
}
const bikeLabels=makeLabels(bikeItems), riderLabels=makeLabels(riderItems);

let mode='riders', focusI=-1, orbitA=0;
const bar=document.getElementById('bar');
function activeItems(){ return mode==='bikes'?bikeItems:riderItems; }
function activeLabels(){ return mode==='bikes'?bikeLabels:riderLabels; }
function overviewFor(m){
  return m==='bikes'
    ? {pos:new THREE.Vector3(0,7.5,-15), tgt:new THREE.Vector3(0,.9,4.5)}
    : {pos:new THREE.Vector3(0,9,-15.5), tgt:new THREE.Vector3(0,.6,7)};
}
function rebuildBar(){
  bar.innerHTML='';
  const all=document.createElement('button');
  all.textContent='ALL'; all.dataset.i=-1; all.className=focusI<0?'on':'';
  bar.appendChild(all);
  activeItems().forEach((it,i)=>{
    const b=document.createElement('button');
    b.textContent=it.skin.name; b.dataset.i=i;
    b.style.color=TIER[it.skin.tier].col;
    if(focusI===i) b.className='on';
    bar.appendChild(b);
  });
}
function setMode(m){
  mode=m; focusI=-1;
  bikesRoot.visible=m==='bikes'; ridersRoot.visible=m==='riders';
  document.getElementById('tabBikes').classList.toggle('on',m==='bikes');
  document.getElementById('tabRiders').classList.toggle('on',m==='riders');
  allLabels.forEach(l=>l.style.display='none');
  rebuildBar();
}
document.getElementById('tabBikes').addEventListener('click',()=>setMode('bikes'));
document.getElementById('tabRiders').addEventListener('click',()=>setMode('riders'));
bar.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  focusI=+b.dataset.i;
  bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
});
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
addEventListener('pointerdown',e=>{
  if(e.target.closest('#bar')||e.target.closest('#tabs')) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr,camera);
  const items=activeItems();
  for(let i=0;i<items.length;i++){
    if(ray.intersectObject(items[i].base,true).length){
      focusI=i;
      bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',+x.dataset.i===i));
      return;
    }
  }
});
setMode('riders');

/* ============================ LOOP ======================================== */
const camPos=new THREE.Vector3(0,9,-15.5), camTgt=new THREE.Vector3(0,.6,7);
let last=performance.now();
function frame(){
  const now=performance.now(), dt=Math.min((now-last)/1000,.05); last=now;
  for(const it of activeItems()) it.spin.rotation.y+=dt*.7;
  let wantPos, wantTgt;
  if(focusI<0){
    const o=overviewFor(mode); wantPos=o.pos; wantTgt=o.tgt;
  } else {
    orbitA+=dt*.4;
    const a=activeItems()[focusI].base.position;
    wantPos=new THREE.Vector3(a.x+Math.sin(orbitA)*4.2, 2.7, a.z+Math.cos(orbitA)*-4.2);
    wantTgt=new THREE.Vector3(a.x, 1.35, a.z);
  }
  camPos.lerp(wantPos, Math.min(1,dt*3.5));
  camTgt.lerp(wantTgt, Math.min(1,dt*3.5));
  camera.position.copy(camPos); camera.lookAt(camTgt);
  const v=new THREE.Vector3();
  const items=activeItems(), labels=activeLabels();
  items.forEach((it,i)=>{
    v.copy(it.anchor).project(camera);
    const el=labels[i];
    const onScreen=v.z<1 && Math.abs(v.x)<1.08;
    const dim=focusI>=0 && focusI!==i;
    el.style.display=onScreen&&!dim?'block':'none';
    el.style.left=((v.x*.5+.5)*innerWidth)+'px';
    el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
  });
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  if(composer) composer.setSize(innerWidth,innerHeight);
});
window.SHOP={ focus(i){ focusI=i; }, setMode, get mode(){ return mode; },
  riders:riderItems, bikes:bikeItems };
